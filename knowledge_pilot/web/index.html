<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KnowledgePilot · Research Chat</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      max-width: 860px; margin: 0 auto; padding: 24px 16px;
      color: #1f2328; background: #fff;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .subtitle { color: #57606a; font-size: 13px; margin: 0 0 16px; }
    #log { display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }
    .msg { white-space: pre-wrap; line-height: 1.6; font-size: 15px; }
    .msg.user {
      align-self: flex-end; background: #e8f0fe; color: #0b57d0;
      padding: 10px 14px; border-radius: 12px; max-width: 80%;
    }
    .msg.assistant { align-self: flex-start; max-width: 100%; }
    .tools { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
    .tool-status { color: #57606a; font-size: 13px; }
    .tool-status.searching { color: #0969da; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1; padding: 10px 12px; border: 1px solid #d0d7de; border-radius: 8px;
      font-size: 14px;
    }
    input:focus { outline: 2px solid #0969da40; border-color: #0969da; }
    button {
      padding: 10px 18px; border: none; border-radius: 8px;
      background: #0969da; color: #fff; font-size: 14px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #status { font-size: 13px; color: #57606a; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>🧭 KnowledgePilot · Research Chat</h1>
  <p class="subtitle">Phase 3 · LangGraph 研究编排（拆解 → 多轮研究 → 评估充分性 → 报告）</p>

  <div id="log"></div>

  <form id="form">
    <input id="input" type="text" placeholder="例如：RAG 的 chunking 策略有哪些？" autocomplete="off" />
    <button id="send" type="submit">发送</button>
  </form>
  <div id="status"></div>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const log = document.getElementById('log');
  const status = document.getElementById('status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    appendMessage('user', text);
    input.value = '';
    send.disabled = true;
    status.textContent = '正在思考…';

    const assistantEl = appendMessage('assistant', '');

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      if (!resp.ok || !resp.body) {
        const detail = await resp.json().then(d => d.detail).catch(() => resp.statusText);
        throw new Error(`请求失败 (${resp.status}): ${detail}`);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const frames = buf.split('\n\n');
        buf = frames.pop() ?? '';
        for (const frame of frames) {
          for (const line of frame.split('\n')) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6);
            if (data === '[DONE]') { status.textContent = ''; return; }
            handleEvent(JSON.parse(data), assistantEl);
          }
        }
      }
    } catch (err) {
      status.textContent = '⚠️ ' + err.message;
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  function handleEvent(evt, assistantEl) {
    switch (evt.type) {
      case 'token':
        assistantEl.querySelector('.content').textContent += evt.content;
        break;
      case 'plan': {
        const el = document.createElement('div');
        el.className = 'tool-status';
        const steps = (evt.plan || []).map(s => s.question || s.goal).filter(Boolean);
        el.textContent = '📋 研究计划：' + steps.join(' → ');
        assistantEl.querySelector('.tools').appendChild(el);
        break;
      }
      case 'status': {
        const el = document.createElement('div');
        el.className = 'tool-status';
        el.textContent = evt.message;
        assistantEl.querySelector('.tools').appendChild(el);
        break;
      }
      case 'eval': {
        const el = document.createElement('div');
        el.className = 'tool-status';
        const mark = evt.sufficient ? '✅ 信息已充分' : '🔁 信息不足，继续研究';
        el.textContent = `第 ${evt.iteration} 轮评估：${mark} — ${evt.reason}`;
        assistantEl.querySelector('.tools').appendChild(el);
        break;
      }
      case 'tool_call': {
        let query = evt.arguments;
        try { query = JSON.parse(evt.arguments).query ?? evt.arguments; } catch {}
        const el = document.createElement('div');
        el.className = 'tool-status searching';
        el.textContent = '🔍 正在搜索：' + query;
        assistantEl.querySelector('.tools').appendChild(el);
        break;
      }
      case 'tool_result': {
        const el = document.createElement('div');
        el.className = 'tool-status';
        el.textContent = '✅ 已获取结果：' + evt.summary;
        assistantEl.querySelector('.tools').appendChild(el);
        break;
      }
      case 'done':
        status.textContent = '';
        break;
    }
  }

  function appendMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    if (role === 'assistant') {
      wrap.innerHTML = '<div class="tools"></div><div class="content"></div>';
      wrap.querySelector('.content').textContent = text;
    } else {
      wrap.textContent = text;
    }
    log.appendChild(wrap);
    window.scrollTo(0, document.body.scrollHeight);
    return wrap;
  }
</script>
</body>
</html>
