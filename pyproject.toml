[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-pilot"
version = "0.1.0"
description = "AI Research Agent — 自主完成拆解→搜索→构建知识库→RAG→分析→验证→生成带引用报告的研究 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Phase 1 RAG：本地 BGE-M3 embedding + Chroma 向量库 + trafilatura 网页正文提取
# torch 由 sentence-transformers 传递引入，不显式 pin
# Phase 2：rank-bm25 提供 BM25 词法检索，与向量检索做混合搜索（RRF 融合）
rag = [
    "trafilatura>=1.6",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "rank-bm25>=0.2.2",
]

[tool.setuptools.packages.find]
include = ["knowledge_pilot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
