[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-pilot"
version = "0.1.0"
description = "AI Research Agent — 自主完成拆解→搜索→构建知识库→RAG→分析→验证→生成带引用报告的研究 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    # Phase 3：LangGraph 编排 Research Workflow（State/Node/Edge/Conditional Edge/Checkpoint）
    # >=0.4 保证 stream_mode="custom" + StreamPart（v2 流协议）稳定
    "langgraph>=0.4",
    # Phase 4：SqliteSaver（图 checkpoint 跨重启持久化；懒导入失败回退 MemorySaver）
    "langgraph-checkpoint-sqlite>=1.0",
    # Phase 6 MCP：stdio 子进程 server（FastMCP）+ client（ClientSession/stdio_client）。
    # 锁 v1：v2（2026-07）是破坏性重写（FastMCP→MCPServer、字段蛇形化），本设计按 v1 稳定 API 写。
    "mcp>=1.9,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Phase 1 RAG：本地 BGE-M3 embedding + Chroma 向量库 + trafilatura 网页正文提取
# torch 由 sentence-transformers 传递引入，不显式 pin
# Phase 2：rank-bm25 提供 BM25 词法检索，与向量检索做混合搜索（RRF 融合）
rag = [
    "trafilatura>=1.6",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "rank-bm25>=0.2.2",
]

[tool.setuptools.packages.find]
include = ["knowledge_pilot*"]

# Phase 10：前端拆成了多文件，web/ 下的静态资源必须随包分发，否则 `pip install`
# 装出来的 wheel 里根本没有 index.html / css / js，`GET /` 直接 404。
#
# **不要写成 `"web/**/*"`**：setuptools 的 glob 在部分实现下要求 `**/` 至少匹配
# 一层目录，`web/index.html` 会因此被漏掉 —— 而漏掉的文件在本地跑 `pytest` 时
# 完全正常（源码树里文件就在那儿），只在装包后暴露。所以这里逐个模式写死，
# 并由 `tests/test_packaging.py` 断言这四条都在。
[tool.setuptools.package-data]
knowledge_pilot = [
    "web/*.html",
    "web/css/*.css",
    "web/js/*.js",
    "web/js/*/*.js",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
